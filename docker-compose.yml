version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optionlab-backend
    ports:
      - "8000:8000"
    environment:
      - CACHE_TTL_SECONDS=300
      - DATABASE_URL=/app/data/optionlab.db
      - DATA_PROVIDER=yfinance
      - LOG_LEVEL=INFO
      - RISK_FREE_RATE=0.05
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - optionlab-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optionlab-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - optionlab-network

volumes:
  backend-data:
    driver: local

networks:
  optionlab-network:
    driver: bridge
